<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Basketball Game</title>
    <style>
        body {
            margin: 0;
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            overflow: hidden;
            flex-direction: column;
        }
        canvas {
            background: #4488cc;
            border: 4px solid #fff;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            cursor: pointer;
        }
        .scoreboard {
            margin-bottom: 15px;
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="scoreboard">
        Điểm: <span id="score">0</span> | Lượt ném còn lại: <span id="lives">10</span>
    </div>
    
    <canvas id="gameCanvas" width="600" height="400"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let score = 0;
        let lives = 10;
        let isDragging = false;
        let startX, startY;

        // Tọa độ và trạng thái quả bóng
        let ball = {
            x: 100,
            y: 300,
            radius: 12,
            vx: 0,
            vy: 0,
            isThrown: false
        };

        // Vị trí rổ bóng rổ
        const hoop = {
            x: 500,
            y: 150,
            width: 60,
            height: 10,
            scored: false
        };

        function resetBall() {
            ball.x = 100;
            ball.y = 300;
            ball.vx = 0;
            ball.vy = 0;
            ball.isThrown = false;
            hoop.scored = false;
        }

        // Xử lý sự kiện kéo chuột để ném bóng
        canvas.addEventListener("mousedown", (e) => {
            if (!ball.isThrown && lives > 0) {
                const rect = canvas.getBoundingClientRect();
                startX = e.clientX - rect.left;
                startY = e.clientY - rect.top;
                
                // Chỉ cho phép kéo nếu bấm vào gần bóng
                if (Math.hypot(startX - ball.x, startY - ball.y) < 30) {
                    isDragging = true;
                }
            }
        });

        canvas.addEventListener("mousemove", (e) => {
            if (isDragging) {
                const rect = canvas.getBoundingClientRect();
                let currentX = e.clientX - rect.left;
                let currentY = e.clientY - rect.top;
                
                // Di chuyển bóng theo tay kéo (giới hạn trong phạm vi)
                ball.x = Math.max(30, Math.min(250, currentX));
                ball.y = Math.max(200, Math.min(380, currentY));
            }
        });

        canvas.addEventListener("mouseup", (e) => {
            if (isDragging) {
                isDragging = false;
                const rect = canvas.getBoundingClientRect();
                let endX = e.clientX - rect.left;
                let endY = e.clientY - rect.top;

                // Tính lực ném dựa vào khoảng cách kéo
                ball.vx = (startX - endX) * 0.15;
                ball.vy = (startY - endY) * 0.15;
                ball.isThrown = true;
                lives--;
                document.getElementById("lives").textContent = lives;
            }
        });

        function update() {
            if (ball.isThrown) {
                // Trọng lực kéo bóng xuống
                ball.vy += 0.25;
                ball.x += ball.vx;
                ball.y += ball.vy;

                // Kiểm tra ghi bàn (bóng rơi vào vùng rổ)
                if (!hoop.scored && 
                    ball.x > hoop.x - 10 && ball.x < hoop.x + hoop.width &&
                    ball.y > hoop.y && ball.y < hoop.y + 15 && ball.vy > 0) {
                    score += 2;
                    document.getElementById("score").textContent = score;
                    hoop.scored = true;
                }

                // Kiểm tra bóng rơi ra ngoài màn hình
                if (ball.y > canvas.height || ball.x > canvas.width || ball.x < 0) {
                    if (lives > 0) {
                        resetBall();
                    }
                }
            }
        }

        function draw() {
            // Xóa màn hình
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Vẽ bảng rổ và vành rổ
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(hoop.x + 40, hoop.y - 40, 10, 80); // Bảng phía sau
            ctx.fillStyle = "#ff4500";
            ctx.fillRect(hoop.x, hoop.y, hoop.width, hoop.height); // Vành rổ

            // Vẽ quả bóng rổ
            ctx.fillStyle = "#ff7700";
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#000";
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Nếu hết lượt
            if (lives === 0 && !ball.isThrown) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "white";
                ctx.font = "30px Arial";
                ctx.textAlign = "center";
                ctx.fillText("HẾT LƯỢT NÉM!", canvas.width / 2, canvas.height / 2 - 10);
                ctx.font = "18px Arial";
                ctx.fillText(`Tổng điểm của bạn: ${score}`, canvas.width / 2, canvas.height / 2 + 30);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
